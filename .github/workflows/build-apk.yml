# GitHub Actions - Build Android APK
# 触发：推送到 main 分支，或手动触发
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 JDK 17 (Android Gradle Plugin 要求)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 安装 Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 4. 安装 Android SDK 命令行工具 + 构建工具 + 平台
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-34" \
                    "build-tools;34.0.0" \
                    "platform-tools" \
                    --sdk_root=${ANDROID_SDK_ROOT}

      # 5. npm 安装依赖
      - name: Install npm dependencies
        run: npm ci

      # 6. Vite 生产构建
      - name: Build web app (Vite)
        run: npm run build:pwa

      # 7. 同步到 Capacitor Android 项目
      - name: Sync Capacitor
        run: npx cap sync android

      # 8. Gradle 构建 Release APK (无签名)
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          JAVA_HOME: ${{ java-settings.root }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      # 9. 上传 APK Artifact（保留 30 天）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinite-numeral-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      # 10. 签名 APK (用 debug keystore 自动签名，方便直接安装)
      - name: Build debug APK (self-signed, installable)
        run: |
          cd android
          ./gradlew assembleDebug
        env:
          JAVA_HOME: ${{ java-settings.root }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinite-numeral-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
