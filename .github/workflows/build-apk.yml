name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-34" \
                    "build-tools;34.0.0" \
                    "platform-tools"

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build web app
        run: npm run build

      # Phase 6 打磨（eng-polish）：测试门禁——npm test 失败则 CI 失败
      - name: Run tests
        run: npm test
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Sync Capacitor
        run: npx cap sync android

      # Gradle 缓存：加速 assembleDebug（基于 android/**/*.gradle* 与 gradle-wrapper.properties 的 hash）
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
        timeout-minutes: 10

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: infinite-numeral-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
